{% extends "base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block content %}
<div class="page-head"><h1>Đổi mật khẩu</h1></div>
<form method="post" class="paper-form narrow">
  <input type="hidden" name="csrf" value="{{ session.csrf }}">
  <label>Mật khẩu hiện tại
    <input type="password" name="old_password" required autocomplete="current-password">
  </label>
  <label>Mật khẩu mới <span class="muted">(tối thiểu 6 ký tự)</span>
    <input type="password" name="new_password" required autocomplete="new-password">
  </label>
  <label>Nhập lại mật khẩu mới
    <input type="password" name="confirm_password" required autocomplete="new-password">
  </label>
  <div class="form-actions">
    <button class="btn primary" type="submit">Đổi mật khẩu</button>
  </div>
</form>
{% endblock %}
